services:

  # frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: copmap-frontend:latest
    container_name: copmap-frontend
    ports:
      - "3000:80"
    networks:
      - copmap-net
    depends_on:
      - api
    restart: unless-stopped

  # MySQL - CopMap Authentication & Identity Store
  mysql:
    image: mysql:8.4
    container_name: copmap-mysql
    environment:
      MYSQL_DATABASE: copmap_auth
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - copmap-net
    volumes:
      - mysql-data:/var/lib/mysql
      - ./compose/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-mysql}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # PostgreSQL - CopMap Tactical Operations Store
  postgres:
    image: postgres:16-alpine
    container_name: copmap-postgres
    environment:
      POSTGRES_DB: copmap
      POSTGRES_USER: ${POSTGRES_USER:-copmap_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - copmap-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-copmap_app} -d $${POSTGRES_DB:-copmap}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis - CopMap Telemetry & Directory Cache
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - copmap-net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot - CopMap Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: copmap-api:latest
    container_name: copmap-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-qa}
      PORT: "8082"
      MYSQL_URL: jdbc:mysql://mysql:3306/copmap_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/copmap
      POSTGRES_USER: ${POSTGRES_USER:-copmap_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-ekqSbKMKgO507t7QvNUz7tXRmlv/eo0YZUkwpFXYKkcsIgJ2e0VsVeelnzX+oUho}
      JWT_ISSUER: ${JWT_ISSUER:-api.copmap.gov}
      FRONT_END_URL: ${FRONT_END_URL:-http://localhost:3000}
    ports:
      - "8082:8082"
    networks:
      - copmap-net
    volumes:
      - pdf-storage:/app/pdf-storage
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  copmap-net:
    name: copmap-network
    driver: bridge

volumes:
  mysql-data:
  postgres-data:
    name: copmap-postgres-data
  redis-data:
  pdf-storage:
    name: copmap-pdf-storage
