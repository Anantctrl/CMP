$kind: http-request
url: "{{baseUrl}}/api/v1/operations/locations/{{locationId}}"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 409 Conflict (Audit Retention Enforced) or 204', function () { pm.expect(pm.response.code).to.be.oneOf([200, 204, 409]); });
      if (pm.response.code === 409) { pm.test('Audit retention rule verified', function () { pm.expect(pm.response.text()).to.include('audit history exists'); }); }
    language: text/javascript
order: 1000
