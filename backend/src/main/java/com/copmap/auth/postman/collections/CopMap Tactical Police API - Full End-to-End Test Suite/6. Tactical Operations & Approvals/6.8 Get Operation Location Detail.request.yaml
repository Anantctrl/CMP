$kind: http-request
url: "{{baseUrl}}/api/v1/operations/locations/{{locationId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Name matches checkpoint', function () { pm.expect(json.name).to.include('Perimeter Checkpoint'); });
    language: text/javascript
order: 8000
