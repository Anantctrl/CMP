$kind: http-request
url: "{{baseUrl}}/api/v1/operations/{{operationId}}/schedule"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{plannerToken}}
body:
  type: json
  content: |-
    {
      "plannedStartAt": "2026-11-20T08:00:00Z",
      "plannedEndAt": "2026-11-20T18:00:00Z",
      "remarks": "Schedule locked for VIP convoy arrival."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Schedule updated', function () { pm.expect(json.plannedStartAt).to.not.be.empty; });
    language: text/javascript
order: 4000
