$kind: http-request
url: "{{baseUrl}}/api/v1/assignments/tasks/{{taskId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{plannerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Returns assignments list', function () { pm.expect(Array.isArray(json)).to.be.true; });
    language: text/javascript
order: 5000
