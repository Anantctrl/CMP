$kind: http-request
name: 5.8 Lead / Supervisor Approves Completion
url: "{{baseUrl}}/api/v1/assignments/{{assignmentId}}/approve"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{plannerToken}}
body:
  type: json
  content: |-
    {
      "remarks": "Field log verified and certified by Lead."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Status is now COMPLETED', function () { pm.expect(json.status).to.eql('COMPLETED'); });
    language: text/javascript
order: 8000
