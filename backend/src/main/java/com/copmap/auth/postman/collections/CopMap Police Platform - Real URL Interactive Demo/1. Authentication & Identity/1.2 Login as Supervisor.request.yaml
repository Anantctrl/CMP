$kind: http-request
url: http://localhost:8082/api/v1/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "supervisor.test.1794677612@police.gov",
      "password": "Password@123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Access token returned', function () { pm.expect(json.accessToken).to.not.be.empty; });
      pm.environment.set('supervisorToken', json.accessToken);
    language: text/javascript
examples: ./.resources/1.2 Login as Supervisor.resources/examples
order: 2000
