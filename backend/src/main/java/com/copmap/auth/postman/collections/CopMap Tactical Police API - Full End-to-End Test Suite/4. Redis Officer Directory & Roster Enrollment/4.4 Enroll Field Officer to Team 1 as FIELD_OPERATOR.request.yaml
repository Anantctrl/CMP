$kind: http-request
url: "{{baseUrl}}/api/v1/teams/{{teamId}}/members"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
body:
  type: json
  content: |-
    {
      "officerId": "{{officerId}}",
      "teamRole": "FIELD_OPERATOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', function () { pm.expect(pm.response.code).to.eql(201); });
      var json = pm.response.json();
      pm.environment.set('teamMemberId', json.id);
    language: text/javascript
order: 4000
