$kind: http-request
url: "{{baseUrl}}/api/v1/officers/available?teamId={{teamId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
queryParams:
  teamId: "{{teamId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Available officers array returned', function () { pm.expect(Array.isArray(json)).to.be.true; });
    language: text/javascript
order: 5000
