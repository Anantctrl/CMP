$kind: http-request
url: "{{baseUrl}}/api/v1/tracking/teams/{{teamId}}/live"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Returns live telemetry array', function () { pm.expect(Array.isArray(json)).to.be.true; });
      pm.test('Contains recorded fix', function () { pm.expect(json.length).to.be.above(0); });
    language: text/javascript
order: 2000
