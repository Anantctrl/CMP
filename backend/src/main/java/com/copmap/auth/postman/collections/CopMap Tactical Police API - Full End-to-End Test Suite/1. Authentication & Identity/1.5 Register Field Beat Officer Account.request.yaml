$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sub-Inspector Anita Deshmukh",
      "email": "officer.test.1794677612@police.gov",
      "password": "Password@123",
      "policePost": "Wakad Police Station",
      "supervisor": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', function () { pm.expect(pm.response.code).to.eql(201); });
      var json = pm.response.json();
      pm.environment.set('officerEmail', json.email);
      pm.environment.set('officerMysqlId', json.id);
    language: text/javascript
order: 5000
