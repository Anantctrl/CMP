$kind: http-request
url: "{{baseUrl}}/api/v1/users/{{officerMysqlId}}"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('User ID matches', function () { pm.expect(json.id).to.eql(pm.environment.get('officerMysqlId')); });
    language: text/javascript
order: 3000
