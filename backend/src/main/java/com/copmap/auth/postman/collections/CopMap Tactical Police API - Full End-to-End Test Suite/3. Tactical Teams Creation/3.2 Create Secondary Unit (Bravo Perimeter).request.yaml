$kind: http-request
url: "{{baseUrl}}/api/v1/teams"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisorToken}}
body:
  type: json
  content: |-
    {
      "name": "Bravo Perimeter Security 7612",
      "description": "Outer perimeter cordoning and arterial nakabandi."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', function () { pm.expect(pm.response.code).to.eql(201); });
      var json = pm.response.json();
      pm.test('Secondary team created', function () { pm.expect(json.id).to.not.be.empty; });
      pm.environment.set('teamId2', json.id);
    language: text/javascript
order: 2000
