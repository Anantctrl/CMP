$kind: http-request
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{officerToken}}
scripts:
  - type: afterResponse
    code: pm.test('Status code is 204 No Content or 200', function () { pm.expect(pm.response.code).to.be.oneOf([200, 204]); });
    language: text/javascript
order: 3000
