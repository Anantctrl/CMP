$kind: http-request
url: http://localhost:8082/api/v1/auth/register
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sr Inspector Vikram Rane",
      "email": "planner.test.1794677612@police.gov",
      "password": "Password@123",
      "policePost": "Shivajinagar Police Division",
      "supervisor": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', function () { pm.expect(pm.response.code).to.eql(201); });
      var json = pm.response.json();
      pm.environment.set('plannerEmail', json.email);
      pm.environment.set('plannerMysqlId', json.id);
    language: text/javascript
examples: ./.resources/1.3 Register Senior Planner Account.resources/examples
order: 3000
