$kind: http-request
url: "{{baseUrl}}/api/v1/operations/{{operationId}}/status"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{plannerToken}}
body:
  type: json
  content: |-
    {
      "status": "ACTIVE",
      "remarks": "Operation dispatched to field commanders."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.expect(pm.response.code).to.eql(200); });
      var json = pm.response.json();
      pm.test('Status is ACTIVE', function () { pm.expect(json.status).to.eql('ACTIVE'); });
    language: text/javascript
order: 5000
